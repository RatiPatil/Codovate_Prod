name: Codovate Production CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── 1. Backend Validation ──────────────────────────────────────────────────
  backend-ci:
    name: Backend CI & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Backend Syntax
        run: node -c server.js

      - name: Check Backend Routes Exist
        run: |
          test -f routes/opportunities.js && echo "✓ opportunities route"
          test -f routes/students.js       && echo "✓ students route"
          test -f routes/applications.js   && echo "✓ applications route"

  # ── 2. Frontend Build & Deploy ─────────────────────────────────────────────
  frontend-build-deploy:
    name: Frontend Build & Deploy
    runs-on: ubuntu-latest
    needs: backend-ci
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend (Vite)
        run: npm run build && cp ./dist/index.html ./dist/404.html
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyCb1SUbOHd0iicYVPK_Y9Sfe33Ud0Tsg60"
          VITE_FIREBASE_AUTH_DOMAIN: "codovate-784ab.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "codovate-784ab"
          VITE_FIREBASE_STORAGE_BUCKET: "codovate-784ab.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "620492991139"
          VITE_FIREBASE_APP_ID: "1:620492991139:web:56ba93f90ac7a955aaad16"
          VITE_FIREBASE_MEASUREMENT_ID: "G-1XL6G2MBL2"
          VITE_API_URL: "https://codovate-prod.onrender.com/api"
          VITE_SOCKET_URL: "https://codovate-prod.onrender.com"

      - name: Report Build Size
        run: |
          echo "=== Build output size ==="
          du -sh ./dist
          echo "=== JS chunks ==="
          ls -lh ./dist/assets/*.js | tail -5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  # ── 3. Deploy to GitHub Pages ──────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-build-deploy]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
