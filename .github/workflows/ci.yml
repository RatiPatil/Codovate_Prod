name: Codovate validation
on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run setup
      - run: npm test
      - run: npm run test:setup
      - run: npm --prefix frontend audit --omit=dev
      - run: npm run build

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm --prefix scripts ci
      - run: npm --prefix scripts run schema:check
      - run: npm --prefix scripts run test:schema
      - run: npm --prefix scripts run test:import
      - run: npm --prefix scripts run test:placement
      - run: npm --prefix scripts run test:directory

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm --prefix scripts ci
      - name: Firestore, Storage and login regressions (demo project only)
        run: npx --yes firebase-tools@15.34.2 emulators:exec --project demo-codovate --only auth,firestore,storage "npm --prefix scripts run test:rules && npm --prefix scripts run test:teams && node scripts/seed-demo-admin.mjs && TEST_DEMO_ADMIN=true npm --prefix scripts run test:login"
