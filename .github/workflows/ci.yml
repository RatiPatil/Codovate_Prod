name: Codovate validation
on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run setup
      - run: npm test
      - run: npm run build
