name: Codovate Production Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codovate-production
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-Deployment Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Codovate structure
        run: |
          test -f frontend/package.json
          test -f frontend/src/lib/firebase.js
          test -f backend/package.json
          test -f backend/server.js
          test -f backend/routes/community.js
          echo "Codovate structure verified"

      - name: Block unwanted website
        run: |
          if git grep -niE 'dhuldev|dhuldev-nashta|nasta center|twilight-spicule|twilight_spicule'; then
            echo "ERROR: Dhuldev/unwanted website content detected."
            exit 1
          fi
          echo "No unwanted website references found"

      - name: Block old Render endpoint
        run: |
          if git grep -ni 'codovate-prod.onrender.com'; then
            echo "ERROR: Old Render production endpoint detected."
            exit 1
          fi
          echo "No old Render endpoint found"

      - name: Verify Firebase configuration
        run: |
          test -n "${{ vars.VITE_FIREBASE_API_KEY }}"
          test -n "${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}"
          test -n "${{ vars.VITE_FIREBASE_PROJECT_ID }}"
          test -n "${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}"
          test -n "${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
          test -n "${{ vars.VITE_FIREBASE_APP_ID }}"
          echo "Firebase variables verified"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          test -f dist/index.html
          grep -qi "Codovate" dist/index.html
          if grep -RqiE 'dhuldev|nasta center|twilight-spicule|twilight_spicule' dist; then
            echo "ERROR: Unwanted content detected in frontend build"
            exit 1
          fi
          echo "Frontend build verified"
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_API_BASE_URL: https://codovate.in/api
          VITE_API_URL: https://codovate.in/api
          VITE_SOCKET_URL: https://codovate.in

      - name: Validate backend
        working-directory: backend
        run: |
          npm ci --omit=dev
          node -c server.js
          echo "Backend validation passed"

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/codovate_vps
          chmod 600 ~/.ssh/codovate_vps
          ssh-keygen -y -f ~/.ssh/codovate_vps >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "SSH configuration verified"

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/codovate_vps "$VPS_USER@$VPS_HOST" << 'REMOTE'
            set -e

            cd /var/www/codovate/Codovate_Prod

            echo "===== UPDATE SOURCE ====="
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "===== VERIFY SOURCE ====="
            if git grep -niE 'dhuldev|dhuldev-nashta|nasta center|twilight-spicule|twilight_spicule'; then
              echo "ERROR: Unwanted website content detected on deployment source"
              exit 1
            fi

            echo "===== FRONTEND BUILD ====="
            export NVM_DIR="/home/codovate/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd frontend
            npm ci --legacy-peer-deps

            cat > .env.production <<'ENV'
VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
VITE_API_BASE_URL=https://codovate.in/api
VITE_API_URL=https://codovate.in/api
VITE_SOCKET_URL=https://codovate.in
ENV

            chmod 600 .env.production
            npm run build
            test -f dist/index.html
            grep -qi "Codovate" dist/index.html

            if grep -RqiE 'dhuldev|nasta center|twilight-spicule|twilight_spicule' dist; then
              echo "ERROR: Unwanted website detected in production build"
              exit 1
            fi

            echo "===== BACKEND DEPENDENCIES ====="
            cd ../backend
            npm ci --omit=dev

            echo "===== BACKEND SYNTAX ====="
            node -c server.js

            echo "===== RESTART BACKEND ====="
            pm2 restart codovate-backend --update-env

            echo "===== NGINX CHECK ====="
            sudo nginx -t
            sudo systemctl reload nginx

            echo "===== HEALTH CHECK ====="
            sleep 5

            test -f /var/www/codovate/Codovate_Prod/frontend/dist/index.html

            curl -fsS --max-time 15 \
              http://127.0.0.1:5000/ > /dev/null

            curl -fsS --max-time 15 \
              https://codovate.in/ > /dev/null

            curl -fsS --max-time 15 \
              https://codovate.in/api/public/stats > /dev/null

            echo "===== PM2 STATUS ====="
            pm2 status

            echo "===== DEPLOYMENT SUCCESSFUL ====="
          REMOTE
